<div id="bt-dashboard-root"></div>
<style>

  #bt-dashboard-root .empty, #bt-dashboard-root .setup, #bt-dashboard-root .errbox {

<script>
(function() {
  // ============================================================
  // KONFIGURASI — ganti dengan URL Web App Apps Script Anda
  // (lihat Code.gs untuk cara deploy)
  // ============================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbzPz0lAw34DZmfiipKHgXqYR5-5_ptHcoulZ5sBaVBPIVE9-JTy5vebzPFtjVnKWeiRsg/exec";
  const REFRESH_MS = 120000; // auto-refresh setiap 2 menit (data di-cache 5 menit di sisi server)
  const PICS = ['SH','ES','AM','JJ','RS'];

  const root = document.getElementById('bt-dashboard-root');
  let allInvoices = [];
  let officialData = null;
  let picDashboards = null;
  let bungaData = null;
  let grandTotals = null;
  let arHistory = [];
  let lastUpdated = null;

  let activeView = 'piutang'; // 'piutang' | 'bunga'

  // state tab "Piutang"
  let activePic = 'ALL';
  let activeStatus = 'ALL';
  let searchTerm = '';
  let sortKey = 'sisaPiutang';
  let sortDir = -1;
  let compareWith = ''; // period key (yyyy-MM) untuk dibandingkan dengan saat ini

  // state tab "Alokasi Bunga"
  let bungaKlien = 'ALL';
  let bungaStatus = 'ALL';
  let bungaSearch = '';

  const BULAN_NAMES = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const BULAN_NAMES_FULL = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  function currentPeriodKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }


  function fmtIDR(n) {
    if (n === null || n === undefined || isNaN(n)) return '-';
    const sign = n < 0 ? '-' : '';
    n = Math.abs(n);
    return sign + 'Rp ' + Math.round(n).toLocaleString('id-ID');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function categorize(status) {
    const s = (status || '').trim().toLowerCase();
    if (s.indexOf('lunas') === 0 || s === 'lunas') return { key: 'LUNAS', label: 'Lunas', cls: 'lunas' };
    if (s.indexOf('sudah jatuh tempo') !== -1) return { key: 'OVERDUE', label: 'Jatuh Tempo', cls: 'overdue' };
    if (s.indexOf('belum jatuh tempo') !== -1) return { key: 'UPCOMING', label: 'Belum Jatuh Tempo', cls: 'upcoming' };
    if (s.indexOf('bermasalah') !== -1 || s.indexOf('terhambat') !== -1) return { key: 'BERMASALAH', label: 'Tagihan Bermasalah', cls: 'bermasalah' };
    if (s.indexOf('kurang bupot') !== -1) return { key: 'KURANG_BUPOT', label: 'kurang Bupot', cls: 'kurangbupot' };
    if (s.indexOf('kurang ssp') !== -1 || s.indexOf('ssp/ppn') !== -1) return { key: 'KURANG_SSP', label: 'Kurang SSP/PPN', cls: 'kurangssp' };
    if (!s) return { key: 'OTHER', label: '—', cls: 'other' };
    return { key: 'OTHER', label: status, cls: 'other' };
  }

  const STATUS_ORDER = [
    { key: 'OVERDUE', label: 'Jatuh Tempo', cls: 'overdue' },
    { key: 'UPCOMING', label: 'Belum Jatuh Tempo', cls: 'upcoming' },
    { key: 'BERMASALAH', label: 'Tagihan Bermasalah', cls: 'bermasalah' },
    { key: 'KURANG_BUPOT', label: 'kurang Bupot', cls: 'kurangbupot' },
    { key: 'KURANG_SSP', label: 'Kurang SSP/PPN', cls: 'kurangssp' },
    { key: 'LUNAS', label: 'Pembayaran Diterima', cls: 'lunas' }
  ];
  // Grid status di bagian atas dashboard tidak menampilkan "Pembayaran Diterima"
  // (itu sudah tercermin lewat "Total Piutang" yang mengecil) — tetap tersedia
  // sebagai pilihan filter di tabel detail invoice di bawah.
  const STATUS_ORDER_TOP = STATUS_ORDER.filter(sd => sd.key !== 'LUNAS');
  // kunci status di picDashboards (Code.gs) memakai penulisan asli kolom L
  const STATUS_SHEET_KEY = {
    OVERDUE: 'Sudah jatuh Tempo',
    UPCOMING: 'Belum jatuh tempo',
    BERMASALAH: 'Tagihan Bermasalah',
    KURANG_BUPOT: 'kurang Bupot',
    KURANG_SSP: 'Kurang SSP/PPN',
    LUNAS: 'LUNAS'
  };

  function aggregatePicDash(picList) {
    const agg = { allSpkInclPPN: 0, tertagih: 0, paid: 0, piutang: 0, belumDitagihInclPPN: 0, status: {} };
    picList.forEach(p => {
      const d = picDashboards && picDashboards[p];
      if (!d) return;
      agg.allSpkInclPPN += d.allSpkInclPPN || 0;
      agg.tertagih += d.tertagih || 0;
      agg.paid += d.paid || 0;
      agg.piutang += d.piutang || 0;
      agg.belumDitagihInclPPN += d.belumDitagihInclPPN || 0;
      Object.keys(d.status || {}).forEach(k => {
        agg.status[k] = (agg.status[k] || 0) + d.status[k];
      });
    });
    return agg;
  }

  // ============================================================
  // MAIN RENDER
  // ============================================================
  function render() {
    if (API_URL.indexOf('PASTE_') === 0) {
      root.innerHTML = `
        <div class="wrap">
          <div class="setup">
            <div class="eyebrow" style="color:var(--amber)">SETUP DIPERLUKAN</div>
            <p style="font-family:var(--font-display);font-size:18px;color:var(--ink);margin:6px 0 4px;">Dashboard belum terhubung ke spreadsheet</p>
            <p>Deploy <b>Code.gs</b> sebagai Web App di spreadsheet sumber, lalu tempel URL-nya ke variabel <code style="display:inline;padding:2px 6px;">API_URL</code> di bagian atas file ini.</p>
          </div>
        </div>`;
      return;
    }

    if (allInvoices.length === 0 && !lastUpdated) {
      root.innerHTML = `<div class="wrap"><div class="empty">Memuat data dari spreadsheet…</div></div>`;
      return;
    }

    const projectSetAll = new Set(allInvoices.map(i => i.tab + '|' + i.codeProject));

    let bodyHtml = '';
    if (activeView === 'piutang') bodyHtml = renderPiutangView();
    else if (activeView === 'bunga') bodyHtml = renderBungaView();

    root.innerHTML = `
      <div class="wrap">
        <div class="header">
          <div class="header-left">
            <p class="eyebrow">B&amp;T GROUP · DIREKTORAT BISNIS</p>
            <h1 class="title">Report Penagihan &amp; Piutang</h1>
            <p class="subtitle">${projectSetAll.size} baris invoice aktif · 5 Sales · data langsung dari spreadsheet sumber</p>
          </div>
          <div class="header-right">
            <div class="live-pill"><span class="live-dot" id="bt-live-dot"></span> <span id="bt-updated-text">terhubung</span></div>
            <button class="refresh-btn" id="bt-refresh-btn">Refresh sekarang</button>
          </div>
        </div>

        <div class="view-tabs">
          <span class="view-tab ${activeView==='piutang'?'active':''}" data-view="piutang">Piutang</span>
          <span class="view-tab ${activeView==='bunga'?'active':''}" data-view="bunga">Alokasi Bunga</span>
        </div>

        ${bodyHtml}

        <p class="footnote">Update terakhir: ${lastUpdated ? new Date(lastUpdated).toLocaleString('id-ID') : '-'} · data mengikuti spreadsheet maksimal 5 menit terakhir</p>
      </div>
    `;

    bindEvents();
  }

  // ============================================================
  // TAB 1: PIUTANG (AR Summary + progress bulanan riil dari snapshot log +
  // detail operasional per invoice, filterable per PIC & status)
  // ============================================================
  function formatPeriodLabel(periodKey) {
    if (!periodKey) return '-';
    const parts = periodKey.split('-');
    const idx = parseInt(parts[1],10) - 1;
    return (BULAN_NAMES_FULL[idx] || parts[1]) + ' ' + parts[0];
  }

  function renderPiutangView() {
    const withCat = allInvoices.map(inv => Object.assign({}, inv, { cat: categorize(inv.status) }));
    const salesList = activePic === 'ALL' ? PICS : [activePic];
    const agg = aggregatePicDash(salesList);

    let filtered = withCat.filter(i => {
      if (activePic !== 'ALL' && i.tab !== activePic) return false;
      if (activeStatus !== 'ALL' && i.cat.key !== activeStatus) return false;
      if (searchTerm) {
        const hay = (i.cust + ' ' + i.pekerjaan + ' ' + i.codeProject).toLowerCase();
        if (hay.indexOf(searchTerm.toLowerCase()) === -1) return false;
      }
      return true;
    });

    filtered.sort((a,b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (typeof av === 'string') { av = av || ''; bv = bv || ''; return sortDir * av.localeCompare(bv); }
      return sortDir * ((av||0) - (bv||0));
    });

    const rowsHtml = filtered.slice(0, 300).map(i => `
      <tr>
        <td class="mono">${i.tab}</td>
        <td>${escapeHtml(i.cust)}</td>
        <td class="pekerjaan-cell">${escapeHtml(i.pekerjaan)}</td>
        <td class="mono">${escapeHtml(String(i.codeProject||''))}</td>
        <td class="num">${fmtIDR(i.totalTagihan)}</td>
        <td class="num" style="${i.sisaPiutang > 1 ? 'color:var(--brick-deep);font-weight:600' : ''}">${fmtIDR(i.sisaPiutang)}</td>
        <td><span class="stamp ${i.cat.cls}">${escapeHtml(i.cat.label)}</span></td>
        <td class="mono">${i.tglJatuhTempo || '-'}</td>
        <td class="ket-cell">${escapeHtml(i.keterangan || '')}</td>
      </tr>
    `).join('');

    const salesLabel = activePic === 'ALL' ? 'B&T Group' : activePic;

    return `
        <div class="filters" style="margin-bottom:22px;">
          <div class="pill-group" id="bt-pic-filters">
            ${['ALL',...PICS].map(p => `<span class="pill ${activePic===p?'active':''}" data-pic="${p}">${p==='ALL'?'B&T Group':p}</span>`).join('')}
          </div>
        </div>

        <p class="section-label">AR Berdasarkan Status <span>· ${escapeHtml(salesLabel)}</span></p>
        <div class="hero-card">
          <div>
            <p class="label">Total Piutang</p>
            <p class="value">${fmtIDR(agg.piutang)}</p>
            <p class="sub">sudah ditagih, belum dibayar</p>
          </div>
          <span class="badge">${escapeHtml(salesLabel)}</span>
        </div>
        <div class="status-grid">
          ${STATUS_ORDER_TOP.map(sd => {
            const val = agg.status[STATUS_SHEET_KEY[sd.key]] || 0;
            return `
            <div class="status-card ${sd.cls}">
              <span class="stamp ${sd.cls}">${escapeHtml(sd.label)}</span>
              <p class="value">${fmtIDR(val)}</p>
            </div>`;
          }).join('')}
        </div>

        <p class="section-label">AR Summary <span>· ${escapeHtml(salesLabel)}</span></p>
        <div class="cards">
          <div class="card">
            <p class="label">Total SPK (incl PPN)</p>
            <p class="value">${fmtIDR(agg.allSpkInclPPN)}</p>
            <p class="sub">nilai kontrak keseluruhan</p>
          </div>
          <div class="card amber">
            <p class="label">Sudah Ditagihkan</p>
            <p class="value">${fmtIDR(agg.tertagih)}</p>
            <p class="sub">total invoice terbit</p>
          </div>
          <div class="card teal">
            <p class="label">Pembayaran Diterima</p>
            <p class="value">${fmtIDR(agg.paid)}</p>
            <p class="sub">sudah dibayar customer</p>
          </div>
          <div class="card brick">
            <p class="label">Belum Ditagihkan</p>
            <p class="value">${fmtIDR(agg.belumDitagihInclPPN)}</p>
            <p class="sub">belum terbit &amp; kirim invoice</p>
          </div>
        </div>

        <p class="section-label">Detail Operasional per Invoice <span>· bisa difilter &amp; dicari</span></p>
        <div class="filters">
          <div class="pill-group" id="bt-status-filters">
            ${[['ALL','Semua Status'],...STATUS_ORDER.map(sd => [sd.key, sd.label])].map(([k,l]) =>
              `<span class="pill ${activeStatus===k?'active':''}" data-status="${k}">${l}</span>`).join('')}
          </div>
          <input class="search" id="bt-search" type="text" placeholder="Cari customer / proyek…" value="${escapeHtml(searchTerm)}" />
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-key="tab">Sales</th>
                <th data-key="cust">Customer</th>
                <th data-key="pekerjaan">Pekerjaan</th>
                <th data-key="codeProject">Code Project</th>
                <th data-key="totalTagihan" style="text-align:right">Total Tagihan</th>
                <th data-key="sisaPiutang" style="text-align:right">Sisa Piutang</th>
                <th data-key="status">Status</th>
                <th data-key="tglJatuhTempo">Jatuh Tempo</th>
                <th>Keterangan</th>
              </tr>
            </thead>
            <tbody>${rowsHtml || '<tr><td colspan="9" style="padding:30px;text-align:center;color:var(--slate)">Tidak ada data yang cocok dengan filter.</td></tr>'}</tbody>
          </table>
        </div>
        <p class="footnote" style="text-align:left;margin-top:8px;">${filtered.length} baris invoice pada filter ini</p>
    `;
  }

  // ============================================================
  // TAB 2: ALOKASI BUNGA HOLDING
  // ============================================================
  function renderBungaView() {
    if (!bungaData || !bungaData.rows) {
      return `<div class="empty">Data alokasi bunga tidak tersedia.</div>`;
    }
    const rows = bungaData.rows;
    const total = bungaData.total || {};

    const klienList = Array.from(new Set(rows.map(r => r.klien).filter(Boolean))).sort();

    let filtered = rows.filter(r => {
      if (bungaKlien !== 'ALL' && r.klien !== bungaKlien) return false;
      if (bungaStatus !== 'ALL') {
        const st = (r.statusPembayaran || '').toLowerCase();
        if (bungaStatus === 'LUNAS' && st.indexOf('lunas') === -1) return false;
        if (bungaStatus === 'BELUM' && st.indexOf('belum lunas') === -1) return false;
        if (bungaStatus === 'ONGOING' && st.indexOf('on going') === -1) return false;
      }
      if (bungaSearch) {
        const hay = (r.klien + ' ' + r.project + ' ' + r.pekerjaan + ' ' + r.projCode).toLowerCase();
        if (hay.indexOf(bungaSearch.toLowerCase()) === -1) return false;
      }
      return true;
    });

    const sumAlokasi = filtered.reduce((a,b) => a + (b.alokasiBunga||0), 0);
    const sumRealisasi = filtered.reduce((a,b) => a + (b.realisasiBunga||0), 0);
    const sumSelisih = filtered.reduce((a,b) => a + (b.selisih||0), 0);

    const rowsHtml = filtered.slice(0, 300).map(r => `
      <tr>
        <td>${escapeHtml(r.klien)}</td>
        <td class="pekerjaan-cell">${escapeHtml(r.project)} <span style="color:var(--slate-light)">— ${escapeHtml(r.pekerjaan)}</span></td>
        <td class="mono">${escapeHtml(r.projCode)}</td>
        <td class="num">${fmtIDR(r.nominalSpk)}</td>
        <td class="num">${fmtIDR(r.alokasiBunga)}</td>
        <td class="num">${fmtIDR(r.realisasiBunga)}</td>
        <td class="num" style="${Math.abs(r.selisih)>1?'color:var(--brick-deep);font-weight:600':''}">${fmtIDR(r.selisih)}</td>
        <td><span class="stamp ${(r.statusPembayaran||'').toLowerCase().indexOf('lunas')===0 || (r.statusPembayaran||'').toLowerCase()==='lunas '?'lunas':(r.statusPembayaran||'').toLowerCase().indexOf('belum')!==-1?'overdue':'other'}">${escapeHtml(r.statusPembayaran||'-')}</span></td>
      </tr>
    `).join('');

    return `
        <p class="section-label">Alokasi Bunga Pinjaman Holding <span>· sumber: sheet "Alokasi Bunga Holding", alokasi biaya bunga per proyek berdasarkan GP</span></p>

        <div class="cards">
          <div class="card brick">
            <p class="label">Total Alokasi Bunga (GP)</p>
            <p class="value">${fmtIDR(sumAlokasi)}</p>
            <p class="sub">${filtered.length} proyek${bungaKlien!=='ALL'?' · '+escapeHtml(bungaKlien):''}</p>
          </div>
          <div class="card amber">
            <p class="label">Realisasi Bunga</p>
            <p class="value">${fmtIDR(sumRealisasi)}</p>
            <p class="sub">sudah diposting finance</p>
          </div>
          <div class="card teal">
            <p class="label">Selisih</p>
            <p class="value">${fmtIDR(sumSelisih)}</p>
            <p class="sub">alokasi vs realisasi</p>
          </div>
          <div class="card">
            <p class="label">Total Alokasi (semua proyek)</p>
            <p class="value">${fmtIDR(total.alokasi)}</p>
            <p class="sub">grand total dari sheet</p>
          </div>
        </div>

        <div class="filters">
          <div class="pill-group" id="bt-bunga-status-filters">
            ${[['ALL','Semua Status'],['BELUM','Belum Lunas'],['LUNAS','Lunas'],['ONGOING','On Going']].map(([k,l]) =>
              `<span class="pill ${bungaStatus===k?'active':''}" data-bungastatus="${k}">${l}</span>`).join('')}
          </div>
          <select class="search" id="bt-bunga-klien" style="width:180px;">
            <option value="ALL">Semua Klien</option>
            ${klienList.map(k => `<option value="${escapeHtml(k)}" ${bungaKlien===k?'selected':''}>${escapeHtml(k)}</option>`).join('')}
          </select>
          <input class="search" id="bt-bunga-search" type="text" placeholder="Cari proyek / kode…" value="${escapeHtml(bungaSearch)}" />
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Klien</th>
                <th>Proyek</th>
                <th>Kode</th>
                <th style="text-align:right">Nominal SPK</th>
                <th style="text-align:right">Alokasi Bunga</th>
                <th style="text-align:right">Realisasi</th>
                <th style="text-align:right">Selisih</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>${rowsHtml || '<tr><td colspan="8" style="padding:30px;text-align:center;color:var(--slate)">Tidak ada data yang cocok dengan filter.</td></tr>'}</tbody>
          </table>
        </div>
    `;
  }

  // ============================================================
  // EVENTS
  // ============================================================
  function bindEvents() {
    const refreshBtn = document.getElementById('bt-refresh-btn');
    if (refreshBtn) refreshBtn.onclick = fetchData;

    root.querySelectorAll('.view-tab').forEach(el => {
      el.onclick = () => { activeView = el.dataset.view; render(); };
    });

    // Tab Piutang
    root.querySelectorAll('#bt-pic-filters .pill').forEach(el => {
      el.onclick = () => { activePic = el.dataset.pic; render(); };
    });
    root.querySelectorAll('#bt-status-filters .pill').forEach(el => {
      el.onclick = () => { activeStatus = el.dataset.status; render(); };
    });
    const searchEl = document.getElementById('bt-search');
    if (searchEl) searchEl.oninput = (e) => { searchTerm = e.target.value; render(); };
    root.querySelectorAll('thead th[data-key]').forEach(th => {
      th.onclick = () => {
        const key = th.dataset.key;
        if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = -1; }
        render();
      };
    });

    // Tab Alokasi Bunga
    root.querySelectorAll('#bt-bunga-status-filters .pill').forEach(el => {
      el.onclick = () => { bungaStatus = el.dataset.bungastatus; render(); };
    });
    const bungaKlienEl = document.getElementById('bt-bunga-klien');
    if (bungaKlienEl) bungaKlienEl.onchange = (e) => { bungaKlien = e.target.value; render(); };
    const bungaSearchEl = document.getElementById('bt-bunga-search');
    if (bungaSearchEl) bungaSearchEl.oninput = (e) => { bungaSearch = e.target.value; render(); };
  }

  // ============================================================
  // FETCH
  // ============================================================
  async function fetchData() {
    const dot = document.getElementById('bt-live-dot');
    const txt = document.getElementById('bt-updated-text');
    try {
      const res = await fetch(API_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      allInvoices = data.invoices || [];
      officialData = data.official || null;
      picDashboards = data.picDashboards || null;
      bungaData = data.bunga || null;
      grandTotals = data.grandTotals || null;
      arHistory = data.arHistory || [];
      lastUpdated = data.lastUpdated || new Date().toISOString();
      if (dot) { dot.classList.remove('err'); }
      if (txt) { txt.textContent = 'live'; }
      render();
    } catch (err) {
      if (dot) dot.classList.add('err');
      if (txt) txt.textContent = 'koneksi gagal';
      if (allInvoices.length === 0) {
        root.innerHTML = `
          <div class="wrap">
            <div class="errbox">
              <p class="eyebrow" style="color:var(--brick)">GAGAL MEMUAT DATA</p>
              <p style="font-family:var(--font-display);font-size:18px;color:var(--ink);margin:6px 0 4px;">Tidak bisa terhubung ke spreadsheet</p>
              <p>Periksa apakah Web App Apps Script masih ter-deploy dengan akses "Anyone", dan URL di API_URL sudah benar.</p>
              <code>${err.message}</code>
            </div>
          </div>`;
      }
    }
  }

  fetchData();
  setInterval(fetchData, REFRESH_MS);
})();
</script>
